<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ZimGENE</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="flag-stripe"></div>
        <header class="site-header">
            <svg class="flag-icon" viewBox="0 0 70 40" role="img" aria-label="Flag of Zimbabwe">
                <rect y="0" width="70" height="5.72" fill="#319208"/>
                <rect y="5.71" width="70" height="5.72" fill="#FFD200"/>
                <rect y="11.43" width="70" height="5.72" fill="#DE2010"/>
                <rect y="17.14" width="70" height="5.72" fill="#000"/>
                <rect y="22.86" width="70" height="5.72" fill="#DE2010"/>
                <rect y="28.57" width="70" height="5.72" fill="#FFD200"/>
                <rect y="34.28" width="70" height="5.72" fill="#319208"/>
                <polygon points="0,0 20,20 0,40" fill="#fff" stroke="#000" stroke-width="1.5"/>
                <polygon points="7,14.5 8.23,18.3 12.23,18.3 9,20.65 10.23,24.45 7,22.1 3.77,24.45 5,20.65 1.77,18.3 5.77,18.3" fill="#DE2010"/>
            </svg>
            <h1>ZimGENE</h1>
        </header>
        <p>Zimbabwe-focused genomic curation prototype</p>
        <ul id="species-list"></ul>
        <h2>Organisms</h2>
        <select id="status-filter">
            <option value="">All</option>
            <option value="infected">Infected</option>
            <option value="healthy">Healthy</option>
        </select>
        <table id="organism-table">
            <thead>
                <tr>
                    <th>Species</th>
                    <th>Pathogen</th>
                    <th>Status</th>
                    <th>Collected</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <h2>Sequences</h2>
        <table id="sequence-table">
            <thead>
                <tr>
                    <th>Accession</th>
                    <th>Type</th>
                    <th>Length (bp)</th>
                    <th>GC %</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button id="prev-page">Previous</button>
        <span id="page-label"></span>
        <button id="next-page">Next</button>
        <footer class="site-footer">
            <p>An independent student project. Not affiliated with or endorsed by any government body. Sequence records come from NCBI GenBank.</p>
        </footer>
        <script src="app.js"></script>
    </body>
</html>
